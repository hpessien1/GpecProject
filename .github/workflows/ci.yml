# Checks every push and pull request to main. CI never deploys: deployment is a manual Coolify
# step by the project owner after this workflow is green (see CLAUDE.md, Section 7).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, type-check, and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint: likely bugs (e.g. hooks called conditionally), not style. Any finding fails CI.
      - run: npm run lint
      # The stylesheets (src/styles/*.css) must stay in the Prettier format (frontend/.prettierrc.json;
      # only they are formatted).
      - run: npm run format:check
      # npm run build runs tsc -b first, so a type error fails this step.
      - run: npm run build

  browser:
    name: Frontend (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    # Two machines side by side, each about half the work: the behaviour tests at desktop and phone
    # width, and the text-contrast check (14 parts). One machine running both took about 7 minutes.
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'browser tests, desktop and phone', projects: '--project=desktop --project=phone' }
          - { name: 'text contrast', projects: '--project=contrast' }
    # Playwright's own image already holds Chromium and the system libraries it needs. Installing them
    # on the plain runner took 1 to 8 minutes, mostly waiting on Ubuntu's package mirror (8 minutes on
    # 2026-10-23). Its version must equal frontend's @playwright/test (checked below). To upgrade:
    # change both, then read the new digest with
    # `docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble`.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      # Chromium uses shared memory; Docker's small default can crash it.
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # A different Playwright version would look for browsers the image does not have; say so plainly.
      - name: Playwright version matches the image
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -q "mcr.microsoft.com/playwright:v$version-noble@" ../.github/workflows/ci.yml || { echo "@playwright/test is $version, but the CI image is a different version. Update the browser job's image in .github/workflows/ci.yml."; exit 1; }
      # Builds the site, serves it with vite preview, and runs this machine's projects. The API is
      # answered with sample data inside the browser, so no backend or database is needed. Failures
      # print in this log.
      - run: npx playwright test ${{ matrix.suite.projects }}

  backend:
    name: Backend (type-check, lint, build, and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Tests use an in-memory MongoDB (mongodb-memory-server); no database secrets are needed.
      - run: npm test

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches a broken Dockerfile here instead of at deploy time. Images are built, never pushed.
      - name: Build API image
        run: docker build -t gpec-api:ci backend
      # The real API address is set in Coolify; any https address satisfies the build check.
      - name: Build website image
        run: docker build --build-arg VITE_API_BASE_URL=https://api.example.com/api -t gpec-web:ci frontend

  security:
    name: Security (dependency audit and secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the latest commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (production dependencies, fail on high or critical)
        run: |
          (cd frontend && npm audit --omit=dev --audit-level=high)
          (cd backend && npm audit --omit=dev --audit-level=high)
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks (secret scan)
        run: ./gitleaks detect --source . --no-banner --redact -v
