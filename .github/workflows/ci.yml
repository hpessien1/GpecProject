# Checks every push and pull request to main. CI never deploys: deployment is a manual Coolify
# step by the project owner after this workflow is green (see CLAUDE.md, Section 7).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, type-check, and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint: likely bugs (e.g. hooks called conditionally), not style. Any finding fails CI.
      - run: npm run lint
      # npm run build runs tsc -b first, so a type error fails this step.
      - run: npm run build

  browser:
    name: Frontend (browser tests and text contrast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The browser Playwright drives, plus the system libraries it needs on Ubuntu.
      - run: npx playwright install --with-deps chromium
      # Builds the site, serves it with vite preview, and runs every project: behaviour tests at
      # desktop and phone width, and the WCAG text-contrast check. The API is answered with sample
      # data inside the browser, so no backend or database is needed. Failures print in this log.
      - run: npx playwright test

  backend:
    name: Backend (type-check, lint, build, and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Tests use an in-memory MongoDB (mongodb-memory-server); no database secrets are needed.
      - run: npm test

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Catches a broken Dockerfile here instead of at deploy time. Images are built, never pushed.
      - name: Build API image
        run: docker build -t gpec-api:ci backend
      # The real API address is set in Coolify; any https address satisfies the build check.
      - name: Build website image
        run: docker build --build-arg VITE_API_BASE_URL=https://api.example.com/api -t gpec-web:ci frontend

  security:
    name: Security (dependency audit and secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the latest commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (production dependencies, fail on high or critical)
        run: |
          (cd frontend && npm audit --omit=dev --audit-level=high)
          (cd backend && npm audit --omit=dev --audit-level=high)
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks (secret scan)
        run: ./gitleaks detect --source . --no-banner --redact -v
