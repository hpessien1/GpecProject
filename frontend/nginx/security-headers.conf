# Security headers for every response. Included in each location block, because nginx drops
# server-level add_header lines in any location that sets its own (the cache headers below).
# __API_ORIGIN__ is replaced at image build time with the origin of VITE_API_BASE_URL.
#
# Content-Security-Policy: scripts, styles, fonts, and video come only from this site; API calls only
# to the GPEC API. Images also from the API (uploaded product photos, served from its
# /api/product-images/) and blob: (the admin form's preview of a photo chosen on this device, which
# exists only in that browser). When Paystack checkout is added, the redirect to Paystack is a page
# navigation and needs no change here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: __API_ORIGIN__; media-src 'self'; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Browsers only honour this over HTTPS (Coolify's proxy). No includeSubDomains: other GPEC
# subdomains may not all have HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
