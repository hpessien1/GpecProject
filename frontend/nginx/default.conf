server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # /assets/ holds two kinds of file: Vite's bundles and fonts, whose names carry a content hash
  # (index-KUHVWms4.js) and change whenever the file does, and the photos and videos from
  # public/assets/, whose names stay the same when GPEC replaces one. Only hashed files are cached
  # for a year; the media is cached for a day so a replaced photo appears within a day.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/security-headers.conf;

    location ~ "-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/snippets/security-headers.conf;
    }
  }

  # index.html names the current bundles, so browsers must check for a new one on every visit.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The site uses hash routes (#shop), so every other path falls back to the home page.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
